<style>
:root{
  --night:#18213a; --night2:#212c4a; --dusk:#2e3a60; --snow:#f6f5f1; --paper:#fbfaf7; --line:#e3e0d8;
  --ink:#1f2a3a; --soft:#5c6575; --kraft:#dcc196; --kraft2:#cfae79; --kraft-ink:#3f2c17; --string:#8a6b47;
  --berry:#9b2c3c; --gold:#e8b84a; --pine:#2d5a3e;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif; --hand:"Caveat Brush","Marker Felt",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--night);color:var(--snow);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 20% -10%,#2b3966 0%,rgba(43,57,102,0) 60%),radial-gradient(900px 500px at 110% 10%,#3a2f55 0%,rgba(58,47,85,0) 60%)}
a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(24,33,58,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:sticky;top:0;z-index:30}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.top nav{display:flex;gap:18px;font-size:14.5px;color:#c4cad8;align-items:center}
.top nav a{text-decoration:none} .top nav a:hover{color:#fff}
.iconbtn{border:0;background:none;padding:6px;border-radius:50%;cursor:pointer;color:#c4cad8;display:inline-grid;place-items:center}
.iconbtn:hover{color:#fff;background:rgba(255,255,255,.08)}

.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:clamp(16px,2.2vw,32px);padding:clamp(14px,2.2vw,30px);max-width:1640px;margin:0 auto;align-items:start}
.stagewrap{position:sticky;top:78px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0d1322;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.stage svg.scene{display:block;width:100%;height:auto}
.stage .label{position:absolute;left:14px;bottom:14px;background:rgba(14,19,34,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-size:13.5px;color:#e6e9f0;pointer-events:none}
.stage .fade{position:absolute;inset:0;background:#0d1322;opacity:0;pointer-events:none;transition:opacity .35s ease}
.stage.swap .fade{opacity:1}
.scenes{display:flex;gap:6px;margin:12px 2px 0;flex-wrap:wrap}
.scenes button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#d9deea;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.scenes button[aria-pressed=true]{background:var(--snow);color:var(--ink);border-color:var(--snow)}
.lightup{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(closest-side,rgba(10,14,26,.15),rgba(10,14,26,.55));transition:opacity .6s}
.lightup[hidden]{display:none}
.lightup button{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3vw,36px);border:0;border-radius:999px;padding:16px 34px;background:var(--gold);color:#2a1d07;cursor:pointer;box-shadow:0 0 0 8px rgba(232,184,74,.18),0 18px 50px rgba(0,0,0,.4)}
.lightup button:hover{background:#f2c962}

.panel{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.guide{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.avatar{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#34416b,#1a2340);display:grid;place-items:end center;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.avatar svg{width:76px;height:auto;margin-bottom:-6px}
.say{position:relative;margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-family:var(--hand);font-size:20px;line-height:1.25;color:#2b2336;min-height:52px}
.say::before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.say.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.who{display:block;font-family:var(--sans);font-size:12.5px;color:var(--soft);margin-top:2px}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.02;margin:0 0 6px;color:var(--ink)}
h1{font-size:clamp(38px,3.6vw,50px)}
h2{font-size:clamp(28px,2.4vw,34px)}
.help{margin:0 0 14px;color:var(--soft);font-size:15px;max-width:44ch}
.story{font-family:var(--serif);font-size:19px;line-height:1.42;margin:0 0 14px;color:#2b3442}
.field{display:grid;gap:6px;margin:4px 0 16px}
.field label{font-size:14px;color:var(--soft)}
.field input{font:inherit;font-size:17px;border:1px solid #d6d2c8;border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}
.sub{font-size:13.5px;color:var(--soft);margin:16px 0 8px;font-weight:400}

.tags{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tag{position:relative;display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;text-align:left;min-height:64px;padding:9px 10px 9px 24px;border:0;cursor:pointer;color:var(--kraft-ink);
  background:linear-gradient(180deg,#e3c9a0,#d7ba8b);clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px),0 14px);transition:transform .15s ease,filter .15s ease}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.tag:hover{filter:brightness(1.04)}
.tag:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--gold)}
.tag .sw{width:46px;height:46px;border-radius:10px;background:#1c2642;display:grid;place-items:center;overflow:hidden}
.tag .sw svg{width:46px;height:46px;display:block}
.tag b{display:block;font-weight:500;font-size:14.5px;line-height:1.2}
.tag small{display:block;font-size:12.5px;line-height:1.25;opacity:.78;margin-top:2px}
.tag .sug{display:inline-block;font-family:var(--hand);font-size:14px;color:var(--berry);margin-top:2px}
.tag[aria-pressed=true]{background:linear-gradient(180deg,#2a3558,#1f2948);color:#f6f2e8}
.tag[aria-pressed=true]::before{background:var(--gold);box-shadow:0 0 0 3px rgba(232,184,74,.3)}
.tag[aria-pressed=true] .sug{color:#f0b9c2}
.tag[aria-pressed=true] .sw{background:#0f1529}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid #d6d2c8;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #cfcabe;background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#a9a395}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff}
.btn.primary:hover{background:#86222f}
.btn.big{padding:13px 22px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:default}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#dcd8cf;position:relative}
.dots i.on{background:var(--gold)}
.dots i.cur{background:var(--berry);transform:scale(1.25)}

.final .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.final .cta{background:#1f2948;color:#f4f1e8;border-radius:16px;padding:16px;margin:14px 0 4px}
.final .cta b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;margin-bottom:4px}
.final .cta span{display:block;font-size:14.5px;color:#cdd3e2;margin-bottom:12px}
.final .recap{font-family:var(--serif);font-size:18px;line-height:1.4;color:#2b3442;margin:0}
.meta{font-size:12.5px;color:var(--soft);margin:12px 0 0}
.shared{background:#fff6e0;border:1px solid #efd9a2;border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:var(--ink);padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.3s;pointer-events:none;z-index:50;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{max-width:1640px;margin:0 auto;padding:0 clamp(14px,2.2vw,30px) 30px;font-size:12.5px;color:#8f98ad}

/* scene animation */
svg.scene .dusk-only{transition:opacity 2.6s ease}
svg.scene.day .dusk-only{opacity:0}
svg.scene .lit{transition:opacity .7s ease}
svg.scene .lit.off{opacity:0}
.m-twinkle .b{animation:tw 2.4s ease-in-out infinite;animation-delay:calc(var(--d) * -1s)}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.28}}
.m-chase .b{animation:ch 1.2s linear infinite;animation-delay:calc(var(--c) * -1s)}
@keyframes ch{0%,49%{opacity:1}50%,100%{opacity:.18}}
.m-breathe{animation:br 4.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.42}}
.fl{animation:flk 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;animation-delay:calc(var(--d,0) * -1s)}
@keyframes flk{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.08)}60%{transform:scale(1.06,.94)}}
.flake{animation:fall var(--dur) linear infinite;animation-delay:calc(var(--del) * -1s)}
@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(var(--dx),var(--h))}}
.staticflakes{display:none}
.eyes{animation:blink 6s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,95%,100%{transform:none}97%{transform:scaleY(.08)}}
.tail{animation:tail 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.glint{animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.75}50%{opacity:1}}

@media (max-width:980px){
  .deck{grid-template-columns:minmax(0,1fr)}
  .stagewrap{top:56px;z-index:10}
  .stage{border-radius:14px}
  .scenes{margin-top:8px}
  .top nav a:first-child{display:none}
}
@media (max-width:480px){
  .tags{grid-template-columns:1fr}
  .tag{min-height:58px}
  .panel{padding:16px 14px 14px;border-radius:16px}
  .guide{grid-template-columns:64px 1fr}
  .avatar{width:64px;height:64px}.avatar svg{width:58px}
  .say{font-size:18px}
  .stage .label{font-size:12px;left:8px;bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  .m-twinkle .b,.m-chase .b,.m-breathe,.fl,.flake,.eyes,.tail,.glint,.say.pop{animation:none}
  .flake{display:none}.staticflakes{display:inline}
  svg.scene .dusk-only,svg.scene .lit{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">118 Hillside Drive</a>
  <nav><a href="/tour/">3D tour</a><a href="/games/">Games</a>
    <button class="iconbtn" id="snd" type="button" aria-pressed="true" aria-label="Sound on"></button></nav>

<svg id="gdefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

      <button class="btn primary" id="next" type="button">Next</button>
    </div>
  </aside>
</main>
<p class="foot">Real photos of 118 Hillside Drive, Woodside. Decorations are illustrations, and the snow is wishful thinking. Snowball is real.</p>
<div id="toast" role="status"></div>
<script>
